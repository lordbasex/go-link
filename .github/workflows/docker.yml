# Publishes the device's Docker image (headless, web panel on 7373) to the
# GitHub Container Registry for amd64 and arm64, tagged with the release
# and "latest": when a release is published, or by hand for a given tag.
name: docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.2)
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-device/go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      # The embedded web panel and the licenses, as the Makefile builds them.
      - run: make panel legal VERSION="$TAG"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        working-directory: backend-device
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/go-link-device"
          docker buildx build -f build/docker.Dockerfile --build-arg VERSION="$TAG" \
            --build-context legal=../dist/.legal --platform linux/amd64,linux/arm64 \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.description="go-link device: headless, web panel on port 7373" \
            --label org.opencontainers.image.licenses=MIT \
            --label org.opencontainers.image.version="$TAG" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" --push .
